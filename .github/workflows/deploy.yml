name: Deploy

# Backend -> Render (Docker, free tier). Frontend -> Vercel (Hobby).
# Runs only after CI passed on the same commit, then smoke-tests the public URLs.
#
# Required repository secrets:
#   RENDER_DEPLOY_HOOK   - the Render service deploy hook URL
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   PUBLIC_API_URL, PUBLIC_WEB_URL  - for the post-deploy smoke test
#   SMOKE_API_KEY, SMOKE_ACCESS_CODE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: 'Deploy without waiting for CI (emergency only)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false      # never cancel a half-finished deploy

jobs:
  gate:
    name: Require green CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on this commit
        if: ${{ !inputs.skip_ci_gate }}
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'CI passed'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success
      - name: Emergency deploy notice
        if: ${{ inputs.skip_ci_gate }}
        run: echo "::warning::CI gate skipped by manual dispatch"

  backend:
    name: Backend to Render
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 20
    steps:
      - name: Trigger the Render deploy hook
        run: |
          test -n "${{ secrets.RENDER_DEPLOY_HOOK }}" || { echo "::error::RENDER_DEPLOY_HOOK is not set"; exit 1; }
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null
          echo "deploy triggered"

      - name: Wait for the new build to come up
        run: |
          api="${{ secrets.PUBLIC_API_URL }}"
          echo "waiting for $api/v1/health"
          for i in $(seq 1 60); do        # up to 10 minutes; a free-tier cold start is slow
            if curl -fsS "$api/v1/health" | grep -q '"status":"ok"'; then
              echo "backend is up after $((i*10))s"; exit 0
            fi
            sleep 10
          done
          echo "::error::backend did not become healthy in 10 minutes"; exit 1

  frontend:
    name: Frontend to Vercel
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx

      - name: Smoke test the public deployment
        env:
          API_KEY: ${{ secrets.SMOKE_API_KEY }}
          APP_ACCESS_CODE: ${{ secrets.SMOKE_ACCESS_CODE }}
        run: |
          python -m tools.smoke_test \
            --api "${{ secrets.PUBLIC_API_URL }}" \
            --web "${{ secrets.PUBLIC_WEB_URL }}"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deploy successful"
            echo ""
            echo "- API: ${{ secrets.PUBLIC_API_URL }}"
            echo "- Web: ${{ secrets.PUBLIC_WEB_URL }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Reminder: the UptimeRobot monitor keeps exactly one service warm."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure notice
        if: failure()
        run: |
          {
            echo "### Deploy smoke test FAILED"
            echo ""
            echo "Fall back to the Hugging Face Space standby:"
            echo "switch \`VITE_API_BASE\` on Vercel to the Space URL."
            echo "See docs/demo_script.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
