name: CI

# Blocks the merge. Enable branch protection on `main` requiring all four jobs:
#   backend / frontend / secrets / docker
# A compilation or type error in EITHER language fails the pipeline and prevents the merge.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: Backend (compile, lint, types, tests, security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies (Tesseract with Hebrew)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng libgl1 libglib2.0-0
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit pytest pytest-cov pytest-asyncio

      # GATE 1 - compilation. A syntax error must never reach main.
      - name: Compile check
        run: python -m compileall -q backend tools eval scripts

      # GATE 2 - lint and format
      - name: Ruff lint
        run: ruff check backend tools eval scripts
      - name: Ruff format check
        run: ruff format --check backend tools eval scripts

      # GATE 3 - static types
      - name: Mypy
        run: mypy backend
      - name: Mypy strict on the domain core
        run: mypy --strict backend/core

      # GATE 4 - architecture: the core must not import adapters or frameworks
      - name: Layering check
        run: python scripts/check_layering.py

      # GATE 5 - tests with a coverage floor on the core
      - name: Pytest
        run: pytest -q --cov=backend/core --cov-report=term-missing --cov-fail-under=80

      # GATE 6 - security scanning
      - name: Bandit
        run: bandit -r backend -ll
      - name: pip-audit
        run: pip-audit --strict

      # GATE 7 - generated artefacts must be current
      - name: OpenAPI is up to date
        run: |
          python scripts/export_openapi.py --out /tmp/openapi.json
          diff -q /tmp/openapi.json docs/openapi.json \
            || { echo "::error::docs/openapi.json is stale. Run scripts/export_openapi.py"; exit 1; }
      - name: Generated TypeScript types are up to date
        run: |
          python scripts/export_types.py --out /tmp/types.ts
          diff -q /tmp/types.ts frontend/src/api/types.ts \
            || { echo "::error::frontend/src/api/types.ts is stale. Run scripts/export_types.py"; exit 1; }

      - name: Documentation links
        run: python scripts/check_docs.py

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # GATE 1 - compilation / types. Blocks the merge.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # GATE 2 - lint (includes the no-literal-hex rule)
      - name: ESLint
        run: npx eslint . --max-warnings 0

      # GATE 3 - unit tests
      - name: Vitest
        run: npx vitest run --reporter=dot

      # GATE 4 - production build must succeed
      - name: Build
        run: npm run build

      # GATE 5 - accessibility
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe)
        run: npx playwright test tests/a11y --reporter=line

  # ---------------------------------------------------------------- secrets
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: a secret must not survive an amend

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No ignored paths were committed
        run: |
          set -e
          fail=0
          for pattern in 'reference/' 'eval/gold.csv' '(^|/)\.env' 'models/.*\.onnx' '.*\.pt'; do
            committed=$(git ls-files | grep -E "$pattern" || true)
            if [ "$pattern" = 'reference/' ]; then
              committed=$(printf '%s\n' "$committed" | grep -Ev '^reference/README\.md$' || true)
            elif [ "$pattern" = '(^|/)\.env' ]; then
              committed=$(printf '%s\n' "$committed" | grep -Ev '(^|/)\.env\.example$' || true)
            fi
            if [ -n "$committed" ]; then
              echo "::error::'$pattern' must never be committed"
              printf '%s\n' "$committed"
              fail=1
            fi
          done
          exit $fail

      - name: .env.example contains no real values
        run: python scripts/check_env_example.py

  # ----------------------------------------------------------------- docker
  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: safeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run and check health
        run: |
          docker run -d --name safeline -p 8000:8000 \
            -e APP_ACCESS_CODE=ci -e API_KEY=ci-key -e LOCAL_ONLY=true \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            safeline:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python - <<'PY'
          import json, sys
          h = json.load(open('/tmp/health.json'))
          assert h.get('status') == 'ok', h
          assert 'heb' in h.get('tesseract_langs', []), f"Hebrew Tesseract missing: {h}"
          print('health ok, Hebrew Tesseract present')
          PY

      - name: Protected route requires a key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/senders)
          test "$code" = "401" || { echo "::error::expected 401, got $code"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs safeline || true

  # ------------------------------------------------------------------- gate
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets, docker]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more CI jobs failed - merge is blocked"
            exit 1
          fi
          echo "all CI jobs passed"
