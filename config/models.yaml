# Safe Line — model and threshold configuration
#
# All tuned thresholds live here so eval/calibrate.py can sweep them
# without touching business code (project rule §9).
#
# This file is a skeleton stub. Values are filled in during:
#   T8  — validators + confusable repair thresholds
#   T13 — TrOCR digit reader selection
#   T14 — scoring ladder calibration
#   T17 — reader bake-off
#   T16 — YOLO experiment (may add region detector config)

# --- Scoring thresholds ----------------------------------------------------
# ScoringConfig defaults in backend/core/scoring.py must equal these (a test enforces it).
# Hand-set knobs first; the block between the markers is rewritten by eval/calibrate.py.
scoring:
  level_a_enabled: true             # ADR-015 PROVISIONAL: set false if Docker/CI shows no agreement
  label_unknown: 0.5                # s_label when a candidate has no governing label
  margin_full_gap: 0.25             # score gap to the runner-up at which s_margin reaches 1.0
  image_unknown: 0.8                # s_image when no PageMeasurement is supplied
  blur_sharp: 100.0                 # ASSUMPTION: Laplacian variance of a fully sharp page
  source_scores:                    # PLAN §5.1
    barcode: 1.0
    printed: 0.85
    screen: 0.80
    stamp: 0.60
    handwritten: 0.45
    unknown: 0.30
  # BEGIN calibrated - eval/calibrate.py rewrites everything up to END; do not edit by hand
  # provenance: PLAN §5.1 initial values, NOT yet calibrated (no dev-split signal dump exists)
  escalation_score_threshold: 0.80  # also in .env
  weights:
    agree: 0.26
    source: 0.18
    label: 0.16
    margin: 0.14
    pattern: 0.10
    conf: 0.08
    image: 0.08
  # END calibrated

# --- Pipeline layers (T15) ---------------------------------------------------
# Switches the ablation table (PLAN §10.5) turns off one at a time:
#   python -m eval.run_eval --split dev --ablation no_second_read
# PipelineLayers defaults in backend/core/pipeline/orchestrator.py must equal these.
layers:
  second_read: true                 # S7 independent re-read of risky candidates
  digit_reader: true                # S7 reader 2b (TrOCR); has no effect without second_read
  learning: true                    # learned layout hints in S4
  logo: true                        # ORB logo fallback in S5

# --- Readers ---------------------------------------------------------------
readers:
  primary_ocr: tesseract             # "tesseract" | "surya" — bake-off decides (T17)
  digit_ocr: trocr                   # "trocr" | "tesseract" — bake-off decides (T17)
  region_detector: rule-based        # "rule-based" | "yolov8n-onnx" — ADR-016 decides (T16)

# --- TrOCR (handwritten digits, T13) --------------------------------------
# Read at runtime from Settings (TROCR_* in .env); mirrored here for calibrate.py.
trocr:
  source_model: microsoft/trocr-small-handwritten
  revision: b4648cfa171985a6745f37ddd637e98c0da958ac
  vision_file: models/trocr_small_encoder_int8.onnx   # git-ignored; see models/README.md
  text_file: models/trocr_small_decoder_int8.onnx
  vocab_file: models/trocr_small_vocab.json
  max_length: 12          # tokens; a digit field is a dozen at most
  candidates: 5           # beam width = readings returned
  max_model_mb: 80        # larger file sets are refused at load

# --- YOLOv8n region detector (experimental, T16) --------------------------
yolo:
  model_path: models/yolov8n-regions.onnx      # git-ignored; see models/README.md
  confidence_threshold: 0.60
  iou_threshold: 0.45

# --- Cloud providers (T18) ---------------------------------------------------
# Read by backend/adapters/vision/config.py; ProvidersConfig defaults must equal these (a test
# enforces it). The chain order is `primary`, then `fallback_order`. A provider with no key, or
# no model id, is skipped and reported as unavailable. Env settings win over the ids below:
# GEMINI_MODEL, OPENROUTER_VISION_MODEL, GROQ_VISION_MODEL.
providers:
  primary: gemini
  fallback_order:
    - openrouter
    - groq
  circuit_breaker:
    failure_threshold: 5          # consecutive failures before opening
    open_duration_seconds: 60
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 8.0
    jitter_factor: 0.25
  token_bucket:                   # per provider: stay under published ceilings, not via 429
    capacity: 10
    refill_seconds: 6.0           # one token per 6 s = ~10 requests per minute
  credential_cooldown_seconds: 60 # a 429 cools one Gemini credential for this long
  max_output_tokens: 800
  temperature: 0.0
  request_timeout_seconds: 30.0
  gemini:
    model: gemini-2.5-flash
    thinking_budget: 0            # 2.5 models reason first and would eat the 800-token cap
  openrouter:
    # A ":free" vision model id. The free list changes weekly and was NOT verified for this
    # commit, so none is pinned: set OPENROUTER_VISION_MODEL (or this key) the day you use it.
    model: null
  groq:
    # Only if the Groq console lists a vision model that day (PLAN §6.2). null skips Groq.
    vision_model: null

# --- S9 escalation (T18) ------------------------------------------------------
# EscalationConfig defaults in backend/core/pipeline/s9_escalate.py must equal these. The
# escalation threshold itself is ESCALATION_SCORE_THRESHOLD (also scoring.escalation_score_threshold).
escalation:
  crop_pad_fraction: 0.02           # margin around a crop, share of the page diagonal
  max_candidates_per_field: 5       # code candidates handed to the model per field
  cloud_reader_confidence: 0.5      # neutral: the model reports none, S8 weights this low
  context_fields: [central_number]  # a redacted thumbnail is sent only for these ...
  context_page_roles: [sap_screen]  # ... on these page roles (PLAN §6.4)
  usd_per_million_input_tokens: 0.30   # ASSUMPTION (PLAN §6.5): Gemini Flash planning prices
  usd_per_million_output_tokens: 2.50

# --- S5 sender + page-role classification (T10) -----------------------------
# ClassifyConfig defaults in backend/core/pipeline/s5_classify.py must equal these.
classify:
  sender_min_ratio: null            # null -> min_ratio of config/senders.json (88)
  logo_min_inlier: 0.35             # ORB inlier ratio
  letterhead_top_fraction: 0.22     # letterhead band when no region was detected
  blank_max_words: 15
  destination_follow_tokens: 4      # tokens removed after the אל: / לכבוד markers
  field_line_tolerance: 0.015       # normalised y distance for a label's value
  field_value_max_tokens: 6
  prompt_version: v1

# --- S6 identity candidates: ID, names, commitment (T12) ----------------------
# IdentityConfig defaults in backend/core/pipeline/s6_candidates_identity.py must equal these.
# Distances are normalised page fractions.
identity:
  id_label_radius: 0.12             # of page width, from the ID label to its first digit
  id_min_digits: 7                  # a lost leading zero is padded in normalization
  id_max_digits: 10                 # a surplus leading zero is stripped in normalization
  id_max_tokens: 4
  name_radius: 0.25                 # ASSUMPTION: a name runs to the end of its line
  name_max_tokens: 4
  commitment_radius: 0.18           # of page width, in the reading direction
  commitment_max_tokens: 3
  chain_gap: 0.05                   # largest gap between tokens of one value
  line_tolerance: 0.015             # y distance that still counts as the same line
  below_gap: 0.05                   # label-to-value vertical gap when the value is below
  column_margin: 0.03               # SAP commitment column slack around its header
  barcode_confidence: 0.95          # reported confidence of a decoded symbol

# --- S7 second local read (T12) ----------------------------------------------
# SecondReadConfig defaults in backend/core/pipeline/s7_second_read.py must equal these.
second_read:
  risky_confidence: 0.75            # reader confidence below this triggers a second read
  pad_fraction: 0.02                # crop padding, fraction of the image diagonal
  upscale: 2.5                      # cubic; below 2 the gain disappears, above 3 only cost grows
  psm: 7                            # Tesseract single-line mode
  digit_candidates: 5               # most alternatives taken from the digit reader

# --- S10 grouping and rows (T20) ---------------------------------------------------
# RowsConfig defaults in backend/core/pipeline/s10_rows.py must equal these.
rows:
  same_location_iou: 0.5   # commitment readings whose boxes overlap this much are one commitment
