# Safe Line — model and threshold configuration
#
# All tuned thresholds live here so eval/calibrate.py can sweep them
# without touching business code (project rule §9).
#
# This file is a skeleton stub. Values are filled in during:
#   T8  — validators + confusable repair thresholds
#   T13 — TrOCR digit reader selection
#   T14 — scoring ladder calibration
#   T17 — reader bake-off
#   T16 — YOLO experiment (may add region detector config)

# --- Scoring thresholds ----------------------------------------------------
# Re-derived by eval/calibrate.py; do not edit manually.
scoring:
  escalation_score_threshold: 0.80   # also in .env; calibrate.py writes here
  level_a_min: 0.95
  level_b_min: 0.80
  level_c_min: 0.60
  # level_d: everything below level_c_min

# --- Readers ---------------------------------------------------------------
readers:
  primary_ocr: tesseract             # "tesseract" | "surya" — bake-off decides (T17)
  digit_ocr: trocr                   # "trocr" | "tesseract" — bake-off decides (T17)
  region_detector: rule-based        # "rule-based" | "yolov8n-onnx" — ADR-016 decides (T16)

# --- TrOCR (handwritten digits) -------------------------------------------
trocr:
  model_path: models/trocr-small-digits.onnx   # git-ignored; see models/README.md
  max_sequence_length: 12

# --- YOLOv8n region detector (experimental, T16) --------------------------
yolo:
  model_path: models/yolov8n-regions.onnx      # git-ignored; see models/README.md
  confidence_threshold: 0.60
  iou_threshold: 0.45

# --- Cloud providers -------------------------------------------------------
providers:
  primary: gemini
  fallback_order:
    - openrouter
    - groq
  circuit_breaker:
    failure_threshold: 5          # consecutive failures before opening
    open_duration_seconds: 60
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 8.0
    jitter_factor: 0.25

# --- S5 sender + page-role classification (T10) -----------------------------
# ClassifyConfig defaults in backend/core/pipeline/s5_classify.py must equal these.
classify:
  sender_min_ratio: null            # null -> min_ratio of config/senders.json (88)
  logo_min_inlier: 0.35             # ORB inlier ratio
  letterhead_top_fraction: 0.22     # letterhead band when no region was detected
  blank_max_words: 15
  destination_follow_tokens: 4      # tokens removed after the אל: / לכבוד markers
  field_line_tolerance: 0.015       # normalised y distance for a label's value
  field_value_max_tokens: 6
  prompt_version: v1

# --- S6 identity candidates: ID, names, commitment (T12) ----------------------
# IdentityConfig defaults in backend/core/pipeline/s6_candidates_identity.py must equal these.
# Distances are normalised page fractions.
identity:
  id_label_radius: 0.12             # of page width, from the ID label to its first digit
  id_min_digits: 7                  # a lost leading zero is padded in normalization
  id_max_digits: 10                 # a surplus leading zero is stripped in normalization
  id_max_tokens: 4
  name_radius: 0.25                 # ASSUMPTION: a name runs to the end of its line
  name_max_tokens: 4
  commitment_radius: 0.18           # of page width, in the reading direction
  commitment_max_tokens: 3
  chain_gap: 0.05                   # largest gap between tokens of one value
  line_tolerance: 0.015             # y distance that still counts as the same line
  below_gap: 0.05                   # label-to-value vertical gap when the value is below
  column_margin: 0.03               # SAP commitment column slack around its header
  barcode_confidence: 0.95          # reported confidence of a decoded symbol

# --- S7 second local read (T12) ----------------------------------------------
# SecondReadConfig defaults in backend/core/pipeline/s7_second_read.py must equal these.
second_read:
  risky_confidence: 0.75            # reader confidence below this triggers a second read
  pad_fraction: 0.02                # crop padding, fraction of the image diagonal
  upscale: 2.5                      # cubic; below 2 the gain disappears, above 3 only cost grows
  psm: 7                            # Tesseract single-line mode
  digit_candidates: 5               # most alternatives taken from the digit reader
