# Safe Line — pyproject.toml
# Python 3.12 · ruff · mypy · pytest
# Deps pinned to patch range here; exact pins in requirements.txt.
# See docs/PLAN.md §3.7 for the full technology table and licence notes.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "safeline"
version = "0.1.0"
description = "Confidence-aware extraction engine for Israeli medical commitment forms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # --- API / server ---
    "fastapi>=0.159,<0.160",
    "starlette>=1.9,<1.10",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.6,<2.7",
    "python-multipart>=0.0.32,<0.1",
    "sse-starlette>=3.5,<3.6",
    # --- Imaging ---
    "pypdfium2>=4.30,<4.31",
    "opencv-python-headless>=4.10,<4.11",
    "numpy>=2.1,<2.2",
    "Pillow>=13,<14",
    # --- OCR / barcodes ---
    "zxing-cpp>=2.2,<2.3",
    "pytesseract>=0.3,<0.4",
    "onnxruntime>=1.20,<1.21",
    # --- NLP / matching ---
    "rapidfuzz>=3.10,<3.11",
    # --- Export ---
    "openpyxl>=3.1,<3.2",
    # --- Cloud providers ---
    "google-genai>=0.8,<0.9",
    "httpx>=0.27,<0.28",
    # --- Security / observability ---
    "filetype>=1.2,<1.3",
    "pypdf>=6.21,<6.22",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-requests",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=0.24,<1",
]

# ─────────────────────────────────────────────────────── ruff ──────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: isort · UP: pyupgrade
# B: bugbear · C4: comprehensions · PIE: misc · RUF: ruff-native
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = [
    "E501",   # line length — enforced by ruff format, not lint
    "B008",   # FastAPI uses function calls in default args
    "RUF012", # ClassVar — Pydantic models use plain list[...] annotations
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tools", "eval", "scripts"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]   # assert in tests is fine

# ────────────────────────────────────────────────────── mypy ───────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build", "dist", ".venv", "node_modules"]

[[tool.mypy.overrides]]
# The domain core is checked at strict level — no Any, full annotations.
module = "backend.core.*"
strict = true

[[tool.mypy.overrides]]
# The inventory tool depends on optional native image/barcode libraries and is
# exercised by its own focused tests; it is not part of backend type checking.
module = "tools.inventory"
ignore_errors = true

[[tool.mypy.overrides]]
# Adapters are checked strictly but not for missing stubs of vendor libs.
module = "backend.adapters.*"
strict = true
ignore_missing_imports = true

# ──────────────────────────────────────────────────── pytest ───────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"

# ──────────────────────────────────────────────────── coverage ─────────────
[tool.coverage.run]
source = ["backend/core"]
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
